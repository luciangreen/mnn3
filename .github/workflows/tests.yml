name: Prolog tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install SWI-Prolog
        run: |
          sudo apt-get update
          sudo apt-get install --yes swi-prolog-nox
      - name: Security barrier tests
        run: swipl -q -s tests/run_tests.pl -g "run_tests(mnn3_security)" -t halt
      - name: Unit and integration tests
        run: swipl -q -s tests/run_tests.pl -g run_tests -t halt
